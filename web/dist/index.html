<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d111b"><meta name="description" content="DaystingIRC in your browser. Channels, private conversations, and Anope services."><title>DaystingIRC · Web</title><link rel="icon" href="assets/icon.png"><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><aside class="sidebar"><a class="brand" href="./"><img src="assets/icon.png" alt=""><span>Daysting<span class="brand-irc">IRC</span><small>WEB CLIENT</small></span></a><button class="network" id="network"><span class="network-icon">◎</span><span><strong id="network-name">Your IRC network</strong><small id="status">Not connected</small></span><span>⌄</span></button><div class="side-label">WORKSPACE <button id="join" aria-label="Join channel">+</button></div><nav id="windows" aria-label="Conversations"></nav><div class="side-bottom"><div class="local-note"><span class="green-dot"></span> Your conversations. Your server.</div><button id="appearance">◐ <span>Appearance</span></button><button id="help">? <span>Help & support</span></button><div class="profile"><span class="avatar" id="initial">D</span><div><strong id="my-nick">Guest</strong><small id="session-note">Ready when you are</small></div><button id="connection" aria-label="Connection settings">⚙</button></div></div></aside>
<main><header class="chat-header"><div><small id="eyebrow">YOUR SPACE TO CONNECT</small><h1 id="title">Welcome to DaystingIRC</h1><p id="topic">A familiar place for real conversations.</p></div><div class="header-actions"><button id="services">Services <span>⌄</span></button><button id="people-toggle" aria-label="Show or hide people">People</button></div></header><div id="banner" role="status" hidden></div><section id="messages" aria-label="Messages" tabindex="0"></section><div class="composer-area"><button id="follow" hidden>↓ Jump to latest</button><form id="composer"><span class="composer-hash">#</span><input id="message" aria-label="Message or IRC command" placeholder="Connect to start a conversation" autocomplete="off" maxlength="500" disabled><button id="send" aria-label="Send message" disabled>↑</button></form><div class="composer-footer"><span><kbd>Enter</kbd> to send · <kbd>/</kbd> for commands</span><span id="security">TLS via your server</span></div></div></main><aside class="people" id="people"><div class="side-label">IN THIS CHANNEL <span id="people-count">0</span></div><div id="user-list"></div><div class="people-footer">A little more human.<br>A little less algorithm.</div></aside></div>
<dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Close dialog">×</button></div><div id="dialog-content"></div></dialog><div id="toast" role="alert" hidden></div><script type="module" src="app.mjs"></script></body></html>
